name: Monitoramento externo
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: monitoramento-tino
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir idade do último backup restaurado
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = '[Monitor Tino] Backup ausente ou atrasado';
            const resposta = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'backup.yml',
              branch: context.payload.repository.default_branch,
              status: 'success', per_page: 1,
            });
            const ultimo = resposta.data.workflow_runs[0];
            // A idade começa no início do dump, não no fim do upload:
            // um job demorado não torna os dados mais recentes.
            const idade = ultimo ? Date.now() - Date.parse(ultimo.run_started_at) : Infinity;
            const atrasado = !Number.isFinite(idade) || idade < 0 || idade > 26 * 60 * 60 * 1000;
            const abertas = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100,
            });
            const existente = abertas.find(i => i.title === titulo && !i.pull_request);
            if (atrasado) {
              if (!existente) await github.rest.issues.create({
                ...context.repo, title: titulo,
                body: 'Não há backup validado com menos de 26 horas na branch principal. Confira o workflow de backup e execute uma nova cópia com restauração validada. Nenhuma credencial ou dado financeiro foi incluído.',
              });
              core.setFailed('Backup ausente ou com mais de 26 horas.');
            } else if (existente) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existente.number,
                body: `Uma cópia com restauração validada voltou a ficar disponível: ${ultimo.html_url}. Confira a causa do atraso.`,
              });
              await github.rest.issues.update({...context.repo, issue_number: existente.number, state: 'closed'});
            }
      - name: Conferir aplicação e banco
        if: always()
        id: saude
        continue-on-error: true
        env:
          MONITORAMENTO_URL: ${{ vars.MONITORAMENTO_URL }}
          MONITORAMENTO_SEGREDO: ${{ secrets.MONITORAMENTO_SEGREDO }}
        run: |
          node <<'JS'
          const endereco = process.env.MONITORAMENTO_URL;
          const segredo = process.env.MONITORAMENTO_SEGREDO;
          if (!endereco || !segredo || new URL(endereco).protocol !== 'https:') throw new Error('Configure URL HTTPS e segredo do monitor.');
          (async () => {
            for (let tentativa = 0; tentativa < 3; tentativa++) {
              try {
                const resposta = await fetch(endereco, {headers: {Authorization: `Bearer ${segredo}`}, redirect: 'error', signal: AbortSignal.timeout(20000)});
                if (resposta.ok && (await resposta.json()).estado === 'ok') return;
              } catch {}
            }
            process.exitCode = 1;
          })();
          JS
      - name: Abrir ou resolver alerta de indisponibilidade
        if: always()
        uses: actions/github-script@v7
        env:
          RESULTADO: ${{ steps.saude.outcome }}
        with:
          script: |
            const titulo = '[Monitor Tino] Aplicação ou banco indisponível';
            const abertas = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100});
            const existente = abertas.find(i => i.title === titulo && !i.pull_request);
            if (process.env.RESULTADO !== 'success' && !existente) {
              await github.rest.issues.create({...context.repo, title: titulo, body: `O monitor externo falhou. Verifique aplicação, banco e configuração do monitor. Execução: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}. Nenhum dado financeiro foi incluído.`});
            } else if (process.env.RESULTADO === 'success' && existente) {
              await github.rest.issues.createComment({...context.repo, issue_number: existente.number, body: 'O monitor voltou a responder normalmente. Confirme a causa e registre o incidente, quando aplicável.'});
              await github.rest.issues.update({...context.repo, issue_number: existente.number, state: 'closed'});
            }
      - name: Marcar falha
        if: steps.saude.outcome != 'success'
        run: exit 1
